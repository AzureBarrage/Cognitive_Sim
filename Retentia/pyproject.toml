[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retentia"
version = "0.1.0"
description = "Biologically-inspired cognitive architecture simulation"
requires-python = ">=3.8"

# Note: runtime dependencies remain in requirements/*.txt for now.

[project.scripts]
retentia = "src.main:cli"
retentia-api = "src.api:main"
retentia-suite = "src.simulation_suite:main"
retentia-ui = "src.frontend_app:main"
retentia-daily-recall-ui = "src.daily_recall_coach_app:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
