version: '3.8'

services:
  cognitive-agent:
    build: .
    container_name: cognitive_sim
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data  # Persist memory to host
      - ./logs:/app/logs
    restart: unless-stopped
    environment:
      - ENV=production
      - PYTHONUNBUFFERED=1
    command: ["uvicorn", "src.api:app", "--host", "0.0.0.0", "--port", "8000"]
